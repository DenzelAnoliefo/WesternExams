server:
  port: ${PORT:8080}
  error:
    include-message: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "Authorization"

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    mock: false
    buckets:
      exams: ${AWS_S3_BUCKET}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-days: 15

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
